
# Levanta todo el sistema con:
# docker compose up --build
#
# Las variables tienen valores predeterminados para desarrollo.
# Para personalizarlas, copiar .env.example como .env.
# Las imágenes utilizan versiones fijas.

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colonia}
      POSTGRES_USER: ${POSTGRES_USER:-colonia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colonia_demo_cambiar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Proveedor de identidad OIDC.
  # Importa el realm cuando todavía no existe.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_demo_cambiar}
      # Expone /health/ready en el puerto de gestión (9000, interno) para el healthcheck.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-colonia.json:/opt/keycloak/data/import/realm-colonia.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8080:8080"
    # La imagen no trae curl: se consulta /health/ready con bash y /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 40
    restart: unless-stopped

  # Inicialización idempotente de Keycloak.
  # Sincroniza el cliente de servicio y sus permisos
  # incluso cuando el realm ya existe.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0.0
    entrypoint: ["/bin/sh", "/opt/keycloak/init/init-keycloak.sh"]
    environment:
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_demo_cambiar}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-colonia_admin_demo_cambiar}
    volumes:
      - ./keycloak/init-keycloak.sh:/opt/keycloak/init/init-keycloak.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy
    # Tarea de una sola vez: configura Keycloak y termina («Exited (0)» es lo esperado).
    restart: "no"

  # Mock del padrón municipal de residentes.
  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./wiremock:/home/wiremock
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Backend FastAPI.
  # Aplica migraciones y datos iniciales al arrancar.
  # Espera a que keycloak-init termine correctamente.
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-colonia}:${POSTGRES_PASSWORD:-colonia_demo_cambiar}@postgres:5432/${POSTGRES_DB:-colonia}
      PADRON_BASE_URL: http://wiremock:8080
      PADRON_TIMEOUT_SECONDS: ${PADRON_TIMEOUT_SECONDS:-3}
      TEMPORADA: ${TEMPORADA:-2027}
      # Al crear la base, deja el primer turno con 2 cupos libres para probar la lista de espera.
      # En el servidor real: SEED_DEMO=false en el .env.
      SEED_DEMO: ${SEED_DEMO:-true}

      KEYCLOAK_ISSUER_URL: http://localhost:8080/realms/colonia
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/colonia
      KEYCLOAK_CLIENT_ID: colonia-spa
      # Cliente de servicio para gestionar las cuentas del personal (secreto de demo: cambiarlo en el .env).
      KEYCLOAK_ADMIN_CLIENT_ID: colonia-admin-api
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-colonia_admin_demo_cambiar}
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      PUBLIC_APP_URL: http://localhost:8000
      AUTH_ENABLED: "true"

    depends_on:
      postgres:
        condition: service_healthy
      keycloak-init:
        condition: service_completed_successfully
      wiremock:
        condition: service_started

    ports:
      - "8000:8000"
    restart: unless-stopped

  # Documentación interactiva del contrato OpenAPI.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
      OAUTH_CLIENT_ID: colonia-spa
      OAUTH_USE_PKCE: "true"
      OAUTH2_REDIRECT_URL: http://localhost:8082/oauth2-redirect.html
    volumes:
      - ./docs/openapi.yaml:/openapi/openapi.yaml:ro
    ports:
      - "8082:8080"
    restart: unless-stopped

  # Verificación de NFRs (docs/VERIFICACION.md). No arranca con `up`: solo con el perfil «verificacion».
  # Comparte la red de Keycloak para iniciar sesión con PKCE igual que el navegador (localhost:8080).
  verificador:
    image: python:3.12.7-slim-bookworm
    profiles: ["verificacion"]
    network_mode: "service:keycloak"
    entrypoint: ["python", "/verificacion/verificar.py"]
    volumes:
      - ./verificacion:/verificacion
      - ./backend:/backend:ro
    depends_on:
      - app

volumes:
  postgres_data:
