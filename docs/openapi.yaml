openapi: 3.0.3
info:
  title: API - Colonia de Vacaciones Municipal 6A
  version: 1.0.0
  description: |
    Contrato OpenAPI de la API del Sistema de Inscripción a la Colonia Municipal.
    Este archivo es la fuente de verdad de la interfaz HTTP (enfoque Contract First).
    La implementación FastAPI debe respetar las operaciones, esquemas, respuestas y seguridad aquí definidos.

    **Errores:** todas las respuestas de error usan Problem Details (RFC 9457, antes RFC 7807)
    con `Content-Type: application/problem+json`.

    **Versionado:** la versión va en la URI (`/api/v1`). Un cambio incompatible se publica como `/api/v2`.

    **Probar con login:** botón *Authorize* → `keycloak` (usuarios de prueba en el README).
servers:
  - url: http://localhost:8000
    description: Aplicación levantada con Docker Compose (vista desde el navegador)

tags:
  - name: Sistema
  - name: Turnos
  - name: Inscripciones
  - name: Administración

paths:
  /api/v1/health:
    get:
      tags: [Sistema]
      summary: Consultar estado de la aplicación y sus dependencias
      description: Público. Responde 503 con `status` en `degraded` si la base, Keycloak o el padrón no responden.
      operationId: obtenerHealth
      responses:
        '200':
          description: Estado de la API y sus dependencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Algún componente no responde (el cuerpo indica cuál)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                api: ok
                database: ok
                keycloak: ok
                padron: error

  /api/v1/system-info:
    get:
      tags: [Sistema]
      summary: Consultar información técnica del sistema
      description: Requiere rol administrador_sistema.
      operationId: obtenerSystemInfo
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Información técnica del sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfoResponse'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/config:
    get:
      tags: [Sistema]
      summary: Obtener configuración pública necesaria para la aplicación
      description: Público. La SPA lo usa para iniciar el login con Keycloak.
      operationId: obtenerConfigPublica
      responses:
        '200':
          description: Configuración pública
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicConfigResponse'

  /api/v1/turnos:
    get:
      tags: [Turnos]
      summary: Listar turnos de la temporada vigente y sus cupos disponibles
      description: Requiere estar autenticado (cualquier rol).
      operationId: listarTurnos
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Lista de turnos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /api/v1/inscripciones:
    post:
      tags: [Inscripciones]
      summary: Registrar una inscripción a un turno
      description: |
        Registra la inscripción aplicando las reglas de edad, residencia, inscripción única
        y disponibilidad de cupos. Si no quedan cupos, la inscripción se registra en lista de espera.
        Requiere rol tutor o administrativo.

        Solo se acepta si el período de inscripción de la temporada activa está abierto.
        Si no está configurado, todavía no abrió o ya cerró, responde 409 con
        `type: /problemas/periodo-no-abierto`.

        No es idempotente: repetir el mismo pedido devuelve 409 y no crea una segunda inscripción.
        Un chico cuya inscripción fue cancelada se puede volver a inscribir: entra como un pedido nuevo.

        La inscripción queda asociada a quien la crea. Si la carga la oficina, el tutor la verá en
        `/api/v1/mis-inscripciones` cuando el correo declarado coincida con el de su usuario.
      operationId: crearInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InscripcionNueva'
            example:
              turno_id: 1
              dni_chico: '50111222'
              nombre_chico: Juan
              apellido_chico: Perez
              fecha_nacimiento: '2017-06-15'
              dni_tutor: '30111222'
              nombre_tutor: Maria
              apellido_tutor: Perez
              email_tutor: maria.perez@example.com
              telefono_tutor: '1123456789'
      responses:
        '201':
          description: Inscripción registrada (CONFIRMADA o LISTA_ESPERA)
          headers:
            Location:
              description: URI de la inscripción creada
              schema:
                type: string
                example: /api/v1/inscripciones/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscripcion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/inscripciones/{id}/cancelar:
    post:
      tags: [Inscripciones]
      summary: Cancelar una inscripción
      description: |
        Cancela una inscripción de la temporada actual.
        El tutor solo puede cancelar las que creó.
        El administrativo puede cancelar cualquiera.
        Si estaba confirmada, promueve al primero en espera del mismo turno.
        Repetir la cancelación no vuelve a liberar un cupo.
      operationId: cancelarInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Inscripción cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscripcion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  
  /api/v1/inscripciones/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 10
    get:
      tags: [Inscripciones]
      summary: Obtener una inscripción
      description: |
        Requiere rol tutor o administrativo. Un tutor solo puede ver las inscripciones que cargó
        o las que la oficina cargó con su correo electrónico; el rol administrativo ve cualquiera.
        Si la inscripción es de otro tutor se responde 404, para no revelar que existe.
      operationId: obtenerInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: La inscripción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscripcion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          description: La inscripción no existe o no pertenece al usuario
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: /problemas/inscripcion-inexistente
                title: Inscripción inexistente
                status: 404
                detail: No existe la inscripción 99
                instance: /api/v1/inscripciones/99
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    put:
      tags: [Inscripciones]
      summary: Corregir los datos de una inscripción
      description: |
        Requiere rol tutor o administrativo. Un tutor solo puede editar sus propias
        inscripciones (o las que la oficina cargó con su correo); el rol administrativo
        puede editar cualquiera.

        No cambia el turno, la temporada, el estado ni la posición en la lista de espera.
        Se validan de nuevo la edad, la inscripción única de la temporada y el padrón
        (solo si cambió el DNI del tutor).

        Una inscripción cancelada no se puede editar y responde 409 con
        `type: /problemas/inscripcion-no-editable`.
        Si la inscripción no existe o no pertenece al tutor se responde 404.
      operationId: editarInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InscripcionEditar'
            example:
              dni_chico: '50111222'
              nombre_chico: Juan
              apellido_chico: Perez
              fecha_nacimiento: '2017-06-15'
              dni_tutor: '30111222'
              nombre_tutor: Maria
              apellido_tutor: Perez
              email_tutor: maria.perez@example.com
              telefono_tutor: '1123456789'
      responses:
        '200':
          description: Inscripción actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscripcion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
        '503':
          $ref: '#/components/responses/ServicioNoDisponible'

  /api/v1/mis-inscripciones:
    get:
      tags: [Inscripciones]
      summary: Consultar las inscripciones del usuario autenticado
      description: |
        Requiere rol tutor.
        Devuelve las inscripciones que cargó el tutor y también las que la oficina cargó
        con su correo electrónico.
      operationId: listarMisInscripciones
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Inscripciones asociadas al usuario autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Inscripcion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/inscripciones:
    get:
      tags: [Administración]
      summary: Consultar todas las inscripciones de la temporada vigente
      description: Requiere rol administrativo.
      operationId: listarInscripcionesAdministracion
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Lista administrativa de inscripciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InscripcionAdministracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/inscripciones/export:
    get:
      tags: [Administración]
      summary: Exportar las inscripciones de la temporada en CSV
      description: |
        Requiere rol administrativo.
        Devuelve todas las inscripciones de la temporada activa en CSV, con separador
        punto y coma y BOM UTF-8 para abrirlo directamente con Excel en español.
      operationId: exportarInscripciones
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Archivo CSV de inscripciones
          headers:
            Content-Disposition:
              description: Nombre del archivo descargado
              schema:
                type: string
                example: attachment; filename="inscripciones-2027.csv"
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/periodo-inscripcion:
    get:
      tags: [Inscripciones]
      summary: Consultar el estado del período de inscripción
      description: |
        Requiere rol tutor o administrativo.
        Devuelve el estado calculado con la temporada activa: `sin_configurar`, `pendiente`,
        `abierto` o `cerrado`.
      operationId: consultarPeriodoInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Estado del período de inscripción de la temporada activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoInscripcionEstado'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/periodo-inscripcion:
    get:
      tags: [Administración]
      summary: Consultar el período de inscripción configurado
      description: Requiere rol administrador_sistema.
      operationId: consultarPeriodoInscripcionAdministracion
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Período configurado para la temporada activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoInscripcionAdministracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    put:
      tags: [Administración]
      summary: Configurar el período de inscripción de la temporada activa
      description: |
        Requiere rol administrador_sistema.
        Las fechas se envían en hora local (America/Argentina/Buenos_Aires) y deben cumplir cierre > apertura.
      operationId: guardarPeriodoInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodoInscripcionEntrada'
      responses:
        '200':
          description: Período guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoInscripcionAdministracion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

    delete:
      tags: [Administración]
      summary: Borrar el período de inscripción de la temporada activa
      description: |
        Requiere rol administrador_sistema.
        Deja la temporada activa sin período configurado, por lo que la inscripción
        queda cerrada hasta que se configure uno nuevo. Es idempotente: si no había
        período configurado también responde 204.
      operationId: borrarPeriodoInscripcion
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '204':
          description: Período borrado (o ya estaba sin configurar)
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/configuracion-temporada:
    get:
      tags: [Administración]
      summary: Consultar la configuración de la temporada activa
      description: Requiere rol administrador_sistema.
      operationId: consultarConfiguracionTemporada
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Configuración de la temporada activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionTemporada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
    put:
      tags: [Administración]
      summary: Activar una temporada y definir el rango de edades
      description: |
        Requiere rol administrador_sistema.
        Al activar una temporada distinta, la anterior queda inactiva.
        Los turnos y el período de inscripción se configuran por separado para la temporada activa.
      operationId: guardarConfiguracionTemporada
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracionTemporada'
      responses:
        '200':
          description: Configuración guardada y temporada activada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionTemporada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /api/v1/admin/distribucion-cupos:
    put:
      tags: [Administración]
      summary: Actualizar la distribución de cupos de los turnos
      description: |
        Requiere rol administrador_sistema.
        La suma de cupos no puede superar el máximo de la temporada (600).
        Un turno no puede quedar por debajo de sus inscripciones confirmadas.
        Si se liberan cupos, se promueven automáticamente inscripciones de la lista de espera.
      operationId: guardarDistribucionCupos
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistribucionCuposEntrada'
      responses:
        '200':
          description: Turnos con la distribución actualizada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /api/v1/admin/temporadas:
    get:
      tags: [Administración]
      summary: Consultar el historial de temporadas
      description: |
        Requiere rol administrador_sistema.
        Devuelve las temporadas configuradas o con turnos o inscripciones, ordenadas de la más
        reciente a la más antigua, con la temporada activa marcada.
      operationId: listarTemporadas
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '200':
          description: Historial de temporadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemporadaHistorial'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /api/v1/admin/turnos:
    get:
      tags: [Administración]
      summary: Consultar los turnos de una temporada
      description: |
        Requiere rol administrador_sistema.
        Si no se indica `temporada`, devuelve los turnos de la temporada activa.
      operationId: listarTurnosAdministracion
      security:
        - keycloak: []
        - bearerAuth: []
      parameters:
        - name: temporada
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          example: 2027
      responses:
        '200':
          description: Turnos de la temporada consultada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    post:
      tags: [Administración]
      summary: Crear un turno en la temporada activa
      description: |
        Requiere rol administrador_sistema.
        La suma de cupos de la temporada no puede superar el máximo (600).
        Las fechas deben estar dentro del año de la temporada activa.
        No puede superponerse con otro turno del mismo nombre y sede.
      operationId: crearTurno
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnoNuevo'
      responses:
        '201':
          description: Turno creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /api/v1/admin/turnos/{turno_id}:
    parameters:
      - name: turno_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    put:
      tags: [Administración]
      summary: Actualizar un turno de la temporada activa
      description: |
        Requiere rol administrador_sistema.
        El cupo no puede quedar por debajo de las inscripciones confirmadas.
        Si se amplía el cupo, se promueven inscripciones de la lista de espera.
        Las fechas deben estar dentro del año de la temporada activa.
        No puede superponerse con otro turno del mismo nombre y sede.
      operationId: actualizarTurno
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnoNuevo'
      responses:
        '200':
          description: Turno actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Administración]
      summary: Eliminar un turno de la temporada activa
      description: |
        Requiere rol administrador_sistema.
        No se puede eliminar un turno con inscripciones asociadas.
      operationId: eliminarTurno
      security:
        - keycloak: []
        - bearerAuth: []
      responses:
        '204':
          description: Turno eliminado
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /api/v1/admin/turnos/copiar:
    post:
      tags: [Administración]
      summary: Copiar los turnos de una temporada anterior a la activa
      description: |
        Requiere rol administrador_sistema.
        Solo se puede usar si la temporada activa todavía no tiene turnos.
        Si no se indica `temporada_origen`, se usa la última temporada anterior con turnos.
        Las fechas se desplazan al año de la temporada activa.
      operationId: copiarTurnos
      security:
        - keycloak: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopiarTurnosEntrada'
      responses:
        '201':
          description: Turnos copiados en la temporada activa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turno'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: Login con Keycloak mediante Authorization Code + PKCE.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/colonia/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/colonia/protocol/openid-connect/token
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por el proveedor de identidad Keycloak/OIDC.

  schemas:
    EstadoServicios:
      type: object
      required: [api, database, keycloak, padron]
      properties:
        api:
          type: string
          enum: [ok, error]
          example: ok
        database:
          type: string
          enum: [ok, error]
          example: ok
        keycloak:
          type: string
          enum: [ok, error]
          example: ok
        padron:
          type: string
          enum: [ok, error]
          example: ok

    HealthResponse:
      allOf:
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, degraded]
              example: ok
        - $ref: '#/components/schemas/EstadoServicios'

    SystemInfoResponse:
      type: object
      required: [app, environment, temporada, version, services]
      properties:
        app:
          type: string
          example: Colonia de Vacaciones 6A
        environment:
          type: string
          example: dev
        temporada:
          type: integer
          example: 2027
        version:
          type: string
          example: 1.1.0
        services:
          $ref: '#/components/schemas/EstadoServicios'

    PublicConfigResponse:
      type: object
      required: [keycloakUrl, realm, clientId, apiBase]
      properties:
        keycloakUrl:
          type: string
          example: http://localhost:8080
        realm:
          type: string
          example: colonia
        clientId:
          type: string
          example: colonia-spa
        apiBase:
          type: string
          example: /api/v1

    Turno:
      type: object
      required: [id, nombre, sede, fecha_desde, fecha_hasta, cupo_total, temporada, cupos_disponibles]
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Turno mañana - Enero
        sede:
          type: string
          example: Polideportivo Municipal
        fecha_desde:
          type: string
          format: date
          example: '2027-01-06'
        fecha_hasta:
          type: string
          format: date
          example: '2027-01-24'
        cupo_total:
          type: integer
          minimum: 0
          example: 200
        temporada:
          type: integer
          example: 2027
        cupos_disponibles:
          type: integer
          minimum: 0
          example: 125

    InscripcionDatos:
      type: object
      required:
        - dni_chico
        - nombre_chico
        - apellido_chico
        - fecha_nacimiento
        - dni_tutor
        - nombre_tutor
        - apellido_tutor
        - email_tutor
        - telefono_tutor
      properties:
        dni_chico:
          type: string
          minLength: 6
          maxLength: 20
          example: '50111222'
        nombre_chico:
          type: string
          minLength: 2
          maxLength: 100
          example: Juan
        apellido_chico:
          type: string
          minLength: 2
          maxLength: 100
          example: Perez
        fecha_nacimiento:
          type: string
          format: date
          description: El chico debe tener entre 6 y 12 años al 1 de enero de la temporada.
          example: '2017-06-15'
        dni_tutor:
          type: string
          minLength: 6
          maxLength: 20
          description: Se valida contra el padrón de residentes.
          example: '30111222'
        nombre_tutor:
          type: string
          minLength: 2
          maxLength: 120
          example: Maria
        apellido_tutor:
          type: string
          minLength: 2
          maxLength: 120
          example: Perez
        email_tutor:
          type: string
          format: email
          example: maria.perez@example.com
        telefono_tutor:
          type: string
          minLength: 6
          maxLength: 50
          example: '1123456789'

    InscripcionNueva:
      allOf:
        - $ref: '#/components/schemas/InscripcionDatos'
        - type: object
          required: [turno_id]
          properties:
            turno_id:
              type: integer
              example: 1

    InscripcionEditar:
      $ref: '#/components/schemas/InscripcionDatos'

    Inscripcion:
      type: object
      required: [id, turno_id, temporada, dni_chico, nombre_chico, apellido_chico, estado, posicion_espera, creado_en]
      properties:
        id:
          type: integer
          example: 10
        turno_id:
          type: integer
          example: 1
        temporada:
          type: integer
          example: 2027
        dni_chico:
          type: string
          example: '50111222'
        nombre_chico:
          type: string
          example: Juan
        apellido_chico:
          type: string
          example: Perez
        estado:
          type: string
          enum: [CONFIRMADA, LISTA_ESPERA, CANCELADA]
          example: CONFIRMADA
        posicion_espera:
          type: integer
          nullable: true
          minimum: 1
          description: Posición en la lista de espera del turno; null si está confirmada.
          example: null
        creado_en:
          type: string
          format: date-time

    InscripcionAdministracion:
      allOf:
        - $ref: '#/components/schemas/Inscripcion'
        - type: object
          required: [dni_tutor, nombre_tutor, apellido_tutor, email_tutor, telefono_tutor, creado_por]         
          properties:
            dni_tutor:
              type: string
              example: '30111222'
            nombre_tutor:
              type: string
              example: Maria 
            apellido_tutor:
              type: string
              example: Perez
            email_tutor:
              type: string
              format: email
              example: maria.perez@example.com
            telefono_tutor:
              type: string
              example: '1123456789'
            creado_por:
              type: string
              description: Identificador del usuario autenticado que creó la inscripción.
              example: 8d53d73d-ef3a-4e3c-a865-2df95fd188f0

    PeriodoInscripcionEstado:
      type: object
      required: [estado, apertura, cierre]
      properties:
        estado:
          type: string
          enum: [sin_configurar, pendiente, abierto, cerrado]
          example: abierto
        apertura:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-01T08:00:00-03:00'
        cierre:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-30T20:00:00-03:00'

    PeriodoInscripcionAdministracion:
      type: object
      required: [temporada, apertura, cierre]
      properties:
        temporada:
          type: integer
          example: 2027
        apertura:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-01T08:00:00-03:00'
        cierre:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-30T20:00:00-03:00'

    PeriodoInscripcionEntrada:
      type: object
      required: [apertura, cierre]
      properties:
        apertura:
          type: string
          format: date-time
          description: Fecha y hora de apertura en hora argentina, sin zona horaria.
          example: '2026-11-01T08:00'
        cierre:
          type: string
          format: date-time
          description: Fecha y hora de cierre en hora argentina, sin zona horaria.
          example: '2026-11-30T20:00'

    ConfiguracionTemporada:
      type: object
      required: [temporada, edad_minima, edad_maxima]
      properties:
        temporada:
          type: integer
          minimum: 1
          maximum: 9999
          example: 2027
        edad_minima:
          type: integer
          minimum: 0
          example: 6
        edad_maxima:
          type: integer
          minimum: 0
          example: 12

    TemporadaHistorial:
      type: object
      required: [temporada, activa, turnos, inscripciones]
      properties:
        temporada:
          type: integer
          minimum: 1
          maximum: 9999
          example: 2027
        activa:
          type: boolean
          example: true
        turnos:
          type: integer
          minimum: 0
          example: 3
        inscripciones:
          type: integer
          minimum: 0
          example: 12

    TurnoNuevo:
      type: object
      required: [nombre, sede, fecha_desde, fecha_hasta, cupo_total]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 120
          example: Turno mañana - Enero
        sede:
          type: string
          minLength: 2
          maxLength: 120
          example: Polideportivo Municipal
        fecha_desde:
          type: string
          format: date
          example: '2027-01-06'
        fecha_hasta:
          type: string
          format: date
          example: '2027-01-24'
        cupo_total:
          type: integer
          minimum: 0
          maximum: 600
          example: 150

    CopiarTurnosEntrada:
      type: object
      properties:
        temporada_origen:
          type: integer
          minimum: 1
          maximum: 9999
          nullable: true
          description: Temporada desde la que se copian los turnos. Si se omite, se usa la última anterior con turnos.
          example: 2027

    DistribucionCuposEntrada:
      type: object
      required: [temporada, turnos]
      properties:
        temporada:
          type: integer
          minimum: 1
          maximum: 9999
          example: 2027
        turnos:
          type: array
          minItems: 1
          items:
            type: object
            required: [turno_id, cupo_total]
            properties:
              turno_id:
                type: integer
                minimum: 1
                example: 1
              cupo_total:
                type: integer
                minimum: 0
                maximum: 600
                example: 150

    ProblemDetails:
      description: Formato de error estándar (RFC 9457, antes RFC 7807)
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Identifica el tipo de problema (about:blank para errores HTTP genéricos)
          example: /problemas/inscripcion-duplicada
        title:
          type: string
          example: Inscripción duplicada
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: El chico ya está inscripto en esta temporada
        instance:
          type: string
          example: /api/v1/inscripciones
        errors:
          type: array
          description: Solo en errores de validación, un elemento por campo inválido.
          items:
            type: object
            properties:
              campo:
                type: string
                example: email_tutor
              mensaje:
                type: string
                example: value is not a valid email address

  responses:
    NoAutenticado:
      description: Falta el token de acceso o el token es inválido/vencido
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            detail: Falta token de acceso
            instance: /api/v1/turnos

    Prohibido:
      description: El usuario autenticado no posee un rol habilitado para la operación
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: No tiene permisos para realizar esta acción
            instance: /api/v1/admin/inscripciones

    NoEncontrado:
      description: El recurso solicitado no existe
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problemas/turno-inexistente
            title: Turno inexistente
            status: 404
            detail: No existe el turno 99 en la temporada 2027
            instance: /api/v1/inscripciones

    Conflicto:
      description: La operación viola una regla de unicidad o entra en conflicto con el estado actual
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            duplicada:
              value:
                type: /problemas/inscripcion-duplicada
                title: Inscripción duplicada
                status: 409
                detail: El chico ya está inscripto en esta temporada
                instance: /api/v1/inscripciones
            periodo:
              value:
                type: /problemas/periodo-no-abierto
                title: Período de inscripción no abierto
                status: 409
                detail: El período de inscripción está cerrado.
                instance: /api/v1/inscripciones

    DatosInvalidos:
      description: Los datos no cumplen las validaciones o reglas de negocio
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            edad:
              value:
                type: /problemas/edad-fuera-de-rango
                title: Edad fuera de rango
                status: 422
                detail: La colonia admite chicos de 6 a 12 años al inicio de la temporada
                instance: /api/v1/inscripciones
            residencia:
              value:
                type: /problemas/no-residente
                title: No figura en el padrón de residentes
                status: 422
                detail: El tutor no figura con domicilio en la jurisdicción
                instance: /api/v1/inscripciones
            validacion:
              value:
                type: /problemas/datos-invalidos
                title: Datos inválidos
                status: 422
                detail: Revise los campos indicados en «errors».
                instance: /api/v1/inscripciones
                errors:
                  - campo: email_tutor
                    mensaje: value is not a valid email address

    ServicioNoDisponible:
      description: El padrón municipal no se encuentra disponible
      headers:
        Retry-After:
          description: Segundos sugeridos antes de reintentar
          schema:
            type: integer
            example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: /problemas/padron-no-disponible
            title: Padrón no disponible
            status: 503
            detail: El padrón no está disponible. Reintente más tarde.
            instance: /api/v1/inscripciones
